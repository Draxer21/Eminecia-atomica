name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v5
      - name: Build
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build --no-configuration-cache 2>&1 | tee build.log
      - name: Report errors as a commit comment
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### Build failed'
            echo '```'
            grep -E -A3 "error:|What went wrong|FAILURE|Exception" build.log | head -c 60000
            echo '```'
          } > report.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@report.md
      - name: Publish release
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MC=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)
          ver=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          jar=$(ls build/libs/*.jar | grep -v -E 'sources|javadoc' | head -1)
          tag="v${ver}-mc${MC}"
          if ! gh release view "$tag" > /dev/null 2>&1; then
            gh release create "$tag" --title "Drax Atomic ${ver} — Minecraft ${MC}" --notes "Drax Atomic ${ver} para Minecraft ${MC} (NeoForge)." --target "$GITHUB_SHA"
          fi
          gh release upload "$tag" "$jar" --clobber
      - name: Server smoke test (autoprueba)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          DRAX_DEMO: 'true'
        run: |
          mkdir -p run/server
          echo "eula=true" > run/server/eula.txt
          printf 'online-mode=false\nlevel-type=minecraft\\:normal\nspawn-protection=0\n' > run/server/server.properties
          ./gradlew runServer --no-configuration-cache > server.log 2>&1 &
          PID=$!
          for i in $(seq 1 150); do
            if grep -q 'DRAXTEST done' server.log; then echo "Self-test done"; break; fi
            if ! kill -0 $PID 2>/dev/null; then echo "Server process ended"; break; fi
            sleep 4
          done
          sleep 15
          kill $PID 2>/dev/null || true
          pkill -f 'net.neoforged' 2>/dev/null || true
          sleep 5
          {
            if grep -q 'Done (' server.log; then echo '### Server started OK'; else echo '### Server did NOT start'; fi
            echo '```'
            grep -E "DRAXTEST|Placed|structure|Could not|could not" server.log | grep -v DEBUG | grep -v "DRAXTEST template " | head -80
            grep -E -i -B1 -A6 "exception|error|failed|couldn't|unknown|missing|invalid" server.log \
              | grep -v -E "DEBUG|^\s*at java\.|^\s*at jdk\." | head -c 50000
            echo '```'
          } > server_report.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@server_report.md
          grep -q 'Done (' server.log
      - name: Client demo (software OpenGL) + capturas
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          LIBGL_ALWAYS_SOFTWARE: '1'
          DRAX_DEMO: 'true'
          DISPLAY: ':99'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri mesa-utils imagemagick > /dev/null
          Xvfb :99 -screen 0 1280x720x24 > /dev/null 2>&1 &
          sleep 2
          mkdir -p run/client shots
          echo '[{"uuid":"380df991-f603-344c-a090-369bad2a924a","name":"Dev","level":4,"bypassesPlayerLimit":false}]' > run/server/ops.json
          ./gradlew runServer --no-configuration-cache > server2.log 2>&1 &
          for i in $(seq 1 120); do grep -q 'Done (' server2.log && break; sleep 3; done
          printf 'onboardAccessibility:false\nnarrator:0\nsoundDevice:""\nguiScale:2\ntutorialStep:none\nrenderDistance:8\n' > run/client/options.txt
          ./gradlew runClient --no-configuration-cache > client.log 2>&1 &
          PID=$!
          taken=""
          for i in $(seq 1 2400); do
            for c in $(grep -o 'DRAXDEMO [a-z_]*' client.log | awk '{print $2}'); do
              case " $taken " in *" $c "*) ;; *) import -window root "shots/$c.png" && taken="$taken $c";; esac
            done
            if echo "$taken" | grep -q ' end'; then echo "All screenshots taken"; break; fi
            if ! kill -0 $PID 2>/dev/null; then echo "Client process ended"; break; fi
            sleep 0.3
          done
          import -window root shots/last.png || true
          kill $PID 2>/dev/null || true
          pkill -f 'net.neoforged' 2>/dev/null || true
          {
            echo "### Client demo — capturas:$taken"
            echo '```'
            grep -E -i -B1 -A4 "draxatomic|missing|unable to|exception|failed|couldn't" client.log \
              | grep -v -E "DEBUG|^\s*at java\.|^\s*at jdk\.|DRAXDEMO" | head -c 40000
            grep -E -i -B1 -A4 "exception|error" server2.log | grep -v -E "DEBUG|^\s*at java\.|^\s*at jdk\." | head -c 20000
            grep -E "Drax Atomic:|DRAXTEST done|Done \(" server2.log | head -20
            for f in run/server/crash-reports/*.txt; do [ -f "$f" ] && grep -A45 -E '^"Server thread"|Thread: Server thread' "$f" | head -c 12000; done
            echo '```'
          } > client_report.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@client_report.md
          cd shots && git init -q && git checkout -q -b ci-screens && git add . \
            && git -c user.name=ci -c user.email=ci@local commit -qm "capturas ${{ github.sha }}" \
            && git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" ci-screens

plugins {
    id 'java-library'
    id 'net.neoforged.gradle.userdev' version '7.1.39'
}

version = "${mod_version}+mc${minecraft_version}"
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

runs {
    configureEach {
        systemProperty 'forge.logging.console.level', 'debug'
        workingDirectory project.layout.projectDirectory.dir('run').dir(name)
        modSource project.sourceSets.main
    }
    client {
        // Solo CI: recorre escenas del mod para sacar capturas.
        systemProperty 'draxatomic.demo', System.getenv('DRAX_DEMO') ?: 'false'
        if (System.getenv('DRAX_DEMO')) {
            argument '--quickPlayMultiplayer'
            argument 'localhost:25565'
        }
    }
    server {
        argument '--nogui'
        // Solo CI: autoprueba al arrancar (estructuras, entidades, Atomic).
        systemProperty 'draxatomic.selfTest', System.getenv('DRAX_DEMO') ?: 'false'
    }
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
}

tasks.withType(ProcessResources).configureEach {
    def props = [minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
                 neo_version: neo_version, mod_id: mod_id, mod_name: mod_name,
                 mod_license: mod_license, mod_version: mod_version]
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') { expand props }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
